; ============================================================
;  scrcpy 投屏配置  —  修改后保存即可生效，无需改代码
; ============================================================

; 【关闭投屏后如何处理手机调试开关】
;   keep = 保持开启（推荐）：下次只要插线 + 双击 MIRROR.bat 就能投屏，手机零操作
;   adb  = 自动关掉「USB 调试」：更安全，但下次必须手动去手机里重新打开
;   full = 连「开发人员选项」一起关：最干净，但下次要重新连点版本号 7 次
AFTER_EXIT = keep

; 【画面最大边长】1080 = 与本机屏幕高度 1:1，清晰度足够且最省 CPU；2688 = 原生分辨率
MAX_SIZE = 1080

; 【帧率上限】60 或 30
MAX_FPS = 60

; 【声音走哪里】
;   off = 声音留在手机上（蓝牙耳机、手机外放都正常。推荐）
;   on  = 把手机声音转发到电脑播放（投屏看视频时用，但会让手机端耳机静音）
AUDIO = off

; 【启动即全屏】让竖屏画面撑满屏幕高度（Ctrl+F 或 Alt+F 可随时切换）
;   on  = 全屏启动（画面最大）
;   off = 窗口模式（带标题栏，方便拖动和关闭）
FULLSCREEN = off

; 【熄屏投屏】手机屏幕熄灭，但电脑照常显示画面（最省电，推荐）
;   on  = 手机黑屏省电，电脑画面正常
;   off = 手机屏幕保持点亮
SCREEN_OFF = on

; 【保持唤醒】防止手机进入深度睡眠导致投屏卡住/掉线
STAY_AWAKE = on

; 【鼠标悬停】鼠标只在点击/拖拽时才操作手机，纯移动不发送事件
;   off = 不转发悬停（推荐，多屏时不会出现光标残留在别的屏幕）
;   on  = 转发悬停（鼠标移动即同步到手机）
MOUSE_HOVER = off

; 【鼠标按键绑定】留空 = 默认（右键=返回、中键=主页、侧键=多任务/通知栏）
;   自定义时按顺序写 4 个字符，依次对应：右键, 中键, 第4键, 第5键
;   可用字符：b=返回  h=主页  s=多任务  n=通知栏  +=转发给手机  -=忽略
;   例：没有侧键的鼠标可写  bs--  → 右键=返回、中键=多任务
MOUSE_BIND =

; 【快捷键修饰键】决定「Alt+P」「Alt+H」这类快捷键用哪个键打头
;   留空   = 默认（左 Alt 或左 Win 键）
;   lctrl  = 改成左 Ctrl（习惯 Ctrl 的人用这个，Ctrl+P = 电源键）
;   lalt,lctrl = 两个都行（注意：选了 Ctrl 后，Ctrl 组合键就不能原样传给手机了）
SHORTCUT_MOD =

; 【启动即开副屏】MIRROR.bat 启动时同时打开的虚拟屏应用
;   多个用英文逗号分隔，留空则只开主屏
;   常用包名：微信 com.tencent.mm   图库 com.huawei.photos
;            备忘录 com.huawei.notepad   设置 com.android.settings
SIDE_APPS =

; 【副屏分辨率】格式 宽x高/DPI
SIDE_SIZE = 720x1280/320

; 【启动副屏时自动打开侧边控制台】
;   on  = MULTI.bat 开完副屏后自动启动网页面板（截图/传文件/应用列表）
;   off = 不自动打开，需要时自己双击 PANEL.bat
AUTO_PANEL = on

; 【竖屏画面旋转】如果你想让画面变成横向铺满屏幕（需歪头看）
;   0   = 不旋转（正常竖屏）
;   90  = 顺时针转 90 度
;   270 = 逆时针转 90 度
ROTATE = 0
